[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infiapp"
version = "0.1.0"
description = "Infiapp framework repo tools and Python dependency manifest"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "boto3==1.36.25",
]

[project.optional-dependencies]
dev = [
    "mypy==1.20.2",
]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["repo_tools*"]
