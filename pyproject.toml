[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infiapp"
version = "0.1.0"
description = "Infiapp framework repo tools and Python dependency manifest"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "boto3==1.36.25",
    "python-slugify==8.0.4",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["repo_tools*"]
