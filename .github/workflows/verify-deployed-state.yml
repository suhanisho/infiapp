name: verify-deployed-state

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify deployed infrastructure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Log runtime versions
        run: |
          echo "::group::Runtime versions"
          python --version
          python -m pip --version
          git --version
          aws --version
          echo "::endgroup::"

      - name: Install Python dependencies
        run: |
          echo "::group::Install Python dependencies"
          python -m pip install ".[dev]"
          echo "::endgroup::"

      - name: Validate deployed state
        run: |
          echo "::group::Validate deployed state"
          python -m repo_tools.check_deployed_state --summary-out "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"
