name: test-db

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Validate DynamoDB specs and generated bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate DynamoDB specs
        run: python3 repo_tools/validate_dynamodb.py

      - name: Check generated files
        run: npm run codegen:check

