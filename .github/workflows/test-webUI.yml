name: test-webUI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webUI/package-lock.json

      - name: Install WebUI dependencies
        run: npm --prefix webUI ci

      - name: Run WebUI package tests
        run: python -m repo_tools test-web

      - name: Build WebUI
        run: python -m repo_tools build-web

      - name: Install Playwright browser
        run: npm --prefix webUI exec playwright install --with-deps chromium

      - name: Start WebUI
        shell: bash
        run: |
          npm --prefix webUI run dev > /tmp/infiapp-webui.log 2>&1 &
          echo "$!" > /tmp/infiapp-webui.pid

      - name: Curl smoke test
        shell: bash
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/sample \
              -X POST \
              -H 'content-type: application/json' \
              --data '{"message":"ci smoke"}' | grep -q 'ci smoke'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/infiapp-webui.log
          exit 1

      - name: Stop WebUI smoke server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/infiapp-webui.pid ]; then
            kill "$(cat /tmp/infiapp-webui.pid)" || true
          fi
          fuser -k 3000/tcp || true

      - name: Screenshot tests
        run: python -m repo_tools test-web-e2e
