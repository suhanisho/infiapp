name: test-webUI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webUI/package-lock.json

      - name: Log runtime versions
        run: |
          echo "::group::Runtime versions"
          python --version
          node --version
          npm --version
          git --version
          echo "::endgroup::"

      - name: Install WebUI dependencies
        run: |
          echo "::group::Install WebUI dependencies"
          npm --prefix webUI ci
          echo "::endgroup::"

      - name: Build WebUI
        run: |
          echo "::group::Build WebUI"
          python -m repo_tools build-web
          echo "::endgroup::"

      - name: Install Playwright browser
        run: |
          echo "::group::Install Playwright Chromium"
          npm --prefix webUI exec playwright install --with-deps chromium
          echo "::endgroup::"

      - name: Playwright E2E and screenshot tests
        run: |
          echo "::group::Playwright E2E and screenshot tests"
          python -m repo_tools test-web-e2e
          echo "::endgroup::"
