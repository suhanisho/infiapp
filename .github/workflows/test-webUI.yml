name: test-webUI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webUI/package-lock.json

      - name: Install WebUI dependencies
        run: npm --prefix webUI ci

      - name: Run WebUI package tests
        run: python -m repo_tools test-web

      - name: Build WebUI
        run: python -m repo_tools build-web

      - name: Install Playwright browser
        run: npm --prefix webUI exec playwright install --with-deps chromium

      - name: Playwright E2E and screenshot tests
        run: python -m repo_tools test-web-e2e
