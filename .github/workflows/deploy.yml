name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Dr. Shalini's Clinic
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLINIC_AGENT_INTERNAL_SECRET: ${{ secrets.CLINIC_AGENT_INTERNAL_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
      CLINIC_ALLOWED_EMAILS: ${{ vars.CLINIC_ALLOWED_EMAILS }}
      CLINIC_ALLOW_SELF_ONBOARDING: ${{ vars.CLINIC_ALLOW_SELF_ONBOARDING }}
      CLINIC_DEMO_SEED_DATA: ${{ vars.CLINIC_DEMO_SEED_DATA }}
      CLINIC_LLM_ENABLED: ${{ vars.CLINIC_LLM_ENABLED }}
      CLINIC_LLM_MODEL: ${{ vars.CLINIC_LLM_MODEL }}
      GOOGLE_TOKEN_SECRET_PREFIX: ${{ vars.GOOGLE_TOKEN_SECRET_PREFIX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Log runtime versions
        run: |
          echo "::group::Runtime versions"
          python --version
          python -m pip --version
          git --version
          aws --version
          echo "::endgroup::"

      - name: Install Python dependencies
        run: |
          echo "::group::Install Python dependencies"
          python -m pip install ".[dev]"
          echo "::endgroup::"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Log Node versions
        run: |
          echo "::group::Node versions"
          node --version
          npm --version
          echo "::endgroup::"

      - name: Install WebUI dependencies
        run: |
          echo "::group::Install WebUI dependencies"
          npm --prefix webUI ci
          echo "::endgroup::"

      - name: Deploy
        run: |
          echo "::group::Deploy repo definition"
          python -m repo_tools.deploy
          echo "::endgroup::"
