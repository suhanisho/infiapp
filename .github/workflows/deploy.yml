name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Infiapp
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Log runtime versions
        run: |
          echo "::group::Runtime versions"
          python --version
          python -m pip --version
          git --version
          aws --version
          echo "::endgroup::"

      - name: Install Python dependencies
        run: |
          echo "::group::Install Python dependencies"
          python -m pip install ".[dev]"
          echo "::endgroup::"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Log Node versions
        run: |
          echo "::group::Node versions"
          node --version
          npm --version
          echo "::endgroup::"

      - name: Install WebUI dependencies
        run: |
          echo "::group::Install WebUI dependencies"
          npm --prefix webUI ci
          echo "::endgroup::"

      - name: Deploy
        run: |
          echo "::group::Deploy repo definition"
          python -m repo_tools.deploy
          echo "::endgroup::"
