name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate specs, generated code, agents, and WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webUI/package-lock.json

      - name: Install WebUI dependencies
        run: npm --prefix webUI ci

      - name: Validate specs
        run: npm run validate

      - name: Check generated files
        run: npm run codegen:check

      - name: Run agent tests
        run: npm run test:agents

      - name: Run WebUI package tests
        run: npm --prefix webUI test

      - name: Build WebUI
        run: npm --prefix webUI run build

      - name: Install Playwright browser
        run: npm --prefix webUI exec playwright install --with-deps chromium

      - name: Start WebUI
        shell: bash
        run: |
          npm --prefix webUI run dev > /tmp/infiloop-webui.log 2>&1 &
          echo "$!" > /tmp/infiloop-webui.pid

      - name: Curl smoke test
        shell: bash
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/hello \
              -X POST \
              -H 'content-type: application/json' | grep -q 'lambda was called'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/infiloop-webui.log
          exit 1

      - name: Stop WebUI smoke server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/infiloop-webui.pid ]; then
            kill "$(cat /tmp/infiloop-webui.pid)" || true
          fi
          fuser -k 3000/tcp || true

      - name: Screenshot tests
        run: npm --prefix webUI run test:e2e

  repo-tools:
    name: Repo tools import check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile repo tools
        run: python3 -m compileall repo_tools agents
