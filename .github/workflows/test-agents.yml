name: test-agents

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Validate and test agents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m repo_tools install-python

      - name: Validate agent specs
        run: python -m repo_tools validate-agents

      - name: Run agent tests
        run: python -m repo_tools test-agents

      - name: Compile agent and repo tool Python
        run: python -m repo_tools compile-python
